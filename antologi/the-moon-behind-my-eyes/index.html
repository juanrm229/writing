<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Moon Behind My Eyes · Quiet Margins</title>
<meta name="description" content="Dibaca di aplikasi Kamera mode malam: memotret langit yang tidak pernah menunjukkan bulan, sampai kameranya dibalik.">
<meta property="og:title" content="The Moon Behind My Eyes">
<meta property="og:description" content="I kept the glass perfectly clean, believing that clarity would make it easier for the light to find me.">
<meta property="og:type" content="article">
<meta name="theme-color" content="#000000">
<script>try { var t = localStorage.getItem('jm:theme'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}</script>
<link rel="icon" type="image/png" href="../../assets/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<link rel="stylesheet" href="moon.css?v=2">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <a class="back" href="../../#putar" id="back">‹ <span id="backLabel">Meja tulis</span></a>
    <p class="night" id="night"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><span id="nightLabel">3 dtk</span></p>
    <button class="icon" id="openSettings" type="button" aria-label="Pengaturan baca" aria-haspopup="dialog" aria-controls="settingsDialog"><span aria-hidden="true">Aa</span></button>
  </header>

  <section class="camera" aria-label="Kamera">
    <div class="viewfinder" id="viewfinder">
      <canvas id="scene" aria-hidden="true"></canvas>
      <span class="grain" aria-hidden="true"></span>
      <span class="level" id="level" aria-hidden="true"><i></i></span>
      <span class="focus-box" id="focusBox" aria-hidden="true"></span>
      <p class="detect" id="detect" aria-live="polite"></p>
      <p class="exposure" id="exposure" aria-hidden="true"></p>
      <span class="flash" id="flash" aria-hidden="true"></span>
      <p class="vf-hint" id="vfHint" aria-hidden="true"></p>
    </div>

    <div class="controls">
      <label class="focus-row" for="focus"><span id="focusLabel">Fokus</span><input type="range" id="focus" min="0" max="100" value="18"><span class="focus-val" id="focusVal">18%</span></label>
      <p class="modes" id="modes" aria-hidden="true"><span data-mode="malam">MALAM</span><span data-mode="foto">FOTO</span><span data-mode="potret">POTRET</span></p>
      <div class="shutter-row">
        <button class="thumb" id="thumb" type="button" aria-label="Buka galeri" aria-haspopup="dialog" aria-controls="gallery"><img id="thumbImg" alt=""><b id="thumbCount"></b></button>
        <button class="shutter" id="shutter" type="button" aria-label="Potret"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="ring" cx="40" cy="40" r="37"/><circle class="exp" id="expRing" cx="40" cy="40" r="37"/><circle class="core" cx="40" cy="40" r="31"/></svg></button>
        <button class="flip" id="flip" type="button" aria-label="Balik kamera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3l1.6-2.2h6.8L17 9h3v10H4z"/><path d="M9.2 13.4a3 3 0 0 1 5.3-1.6M14.8 14.6a3 3 0 0 1-5.3 1.6"/><path d="m14.6 10.6-.1 1.4-1.4-.2M9.4 17.4l.1-1.4 1.4.2"/></svg></button>
      </div>
    </div>
  </section>

  <section class="caption" id="caption" aria-live="polite">
    <header class="cap-head"><p class="kicker" id="kicker">Puisi · Juan</p><h1 class="cap-title" id="title">The Moon Behind My Eyes</h1></header>
    <p class="lost" id="lost" hidden></p>
    <div class="cap-photo" id="capPhoto"></div>
    <div class="cap-actions" id="capActions"></div>
  </section>
</div>

<dialog class="gallery" id="gallery" aria-labelledby="galleryTitle">
  <header class="dialog-head"><h2 id="galleryTitle">Galeri</h2><button class="close" data-close type="button" aria-label="Tutup">×</button></header>
  <ol class="photos" id="photos"></ol>
</dialog>

<dialog id="settingsDialog" aria-labelledby="settingsTitle">
  <header class="dialog-head"><h2 id="settingsTitle">Pengaturan baca</h2><button class="close" data-close type="button" aria-label="Tutup">×</button></header>
  <div class="settings-body">
    <div class="setting-row"><span id="sizeLabel">Ukuran huruf</span><span><button class="setting-button" id="smaller" type="button" aria-label="Perkecil huruf">A−</button><button class="setting-button" id="bigger" type="button" aria-label="Perbesar huruf">A+</button></span></div>
    <div class="setting-row"><span id="motionLabel">Gerak</span><button class="setting-button" id="motion" type="button" aria-pressed="true">Aktif</button></div>
    <div class="setting-row"><span id="themeLabel">Tampilan</span><button class="setting-button" id="theme" type="button">Gelap</button></div>
    <div class="setting-row"><span id="languageLabel">Bahasa</span><button class="setting-button" id="language" type="button">English</button></div>
  </div>
</dialog>
<p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
<script src="moon.js?v=2"></script>
</body>
</html>
