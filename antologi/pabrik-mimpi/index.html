<!doctype html>
<html lang="id" data-view="sleep">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pabrik Mimpi · Quiet Margins</title>
<meta name="description" content="Larut. Pabrik Mimpi dibaca seperti mimpi: yang sudah dibaca larut menjadi bintang, yang benar-benar terjadi tetap tinggal.">
<meta name="theme-color" content="#07070d">
<script>try { var t = localStorage.getItem('jm:theme'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}</script>
<link rel="icon" href="../../assets/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap">
<link rel="stylesheet" href="mimpi.css?v=2">
</head>
<body>
<canvas class="sky" id="sky" aria-hidden="true"></canvas>
<div class="dawn" aria-hidden="true"></div>
<a class="corner back" href="../../#putar" id="back" aria-label="Kembali ke meja tulis">‹</a>
<button class="corner settings" id="openSettings" type="button" aria-label="Pengaturan baca" aria-haspopup="dialog" aria-controls="settingsDialog"><span aria-hidden="true">Aa</span></button>
<span class="reading-line" id="readingLine" role="progressbar" aria-label="Kemajuan membaca" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></span>

<main class="dream" id="dream">
  <header class="sleep" id="sleep">
    <h1 id="title">Pabrik Mimpi</h1>
    <p class="sleep-note" id="sleepNote">Gulir pelan.</p>
    <div class="sleep-actions"><button class="quiet" id="resume" type="button" hidden>Lanjutkan tidur</button><button class="quiet" id="again" type="button" hidden>Tidur lagi</button></div>
  </header>
  <div class="story" id="story"><p class="loading">…</p></div>
  <footer class="wake" id="wake" hidden>
    <a class="quiet" href="../../#putar" id="wakeBack">Kembali ke meja tulis</a>
    <button class="quiet" id="wakeAgain" type="button">Tidur lagi</button>
  </footer>
</main>

<dialog id="settingsDialog" aria-labelledby="settingsTitle">
  <header class="dialog-head"><h2 id="settingsTitle">Pengaturan baca</h2><button class="close" data-close type="button" aria-label="Tutup">×</button></header>
  <div class="settings-body">
    <div class="setting-row"><span id="sizeLabel">Ukuran huruf</span><span><button class="setting-button" id="smaller" type="button" aria-label="Perkecil huruf">A−</button><button class="setting-button" id="bigger" type="button" aria-label="Perbesar huruf">A+</button></span></div>
    <div class="setting-row"><span id="dissolveLabel">Biarkan kalimat larut</span><button class="setting-button" id="dissolve" type="button" aria-pressed="true">Ya</button></div>
    <p class="dialog-note" id="dissolveNote">Kalimat yang sudah dibaca larut menjadi bintang. Ketuk bintang di tempatnya untuk memunculkannya sebentar.</p>
    <div class="setting-row"><span id="motionLabel">Gerak</span><button class="setting-button" id="motion" type="button" aria-pressed="true">Aktif</button></div>
    <div class="setting-row"><span id="themeLabel">Tampilan</span><button class="setting-button" id="theme" type="button">Gelap</button></div>
    <div class="setting-row"><span id="languageLabel">Bahasa</span><button class="setting-button" id="language" type="button">English</button></div>
  </div>
</dialog>
<p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
<script src="mimpi.js?v=2"></script>
</body>
</html>
